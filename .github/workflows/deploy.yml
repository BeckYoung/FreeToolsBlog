# 把 main 分支的改动自动部署到已有的 Cloudflare Pages 项目 freeres（freeres.pages.dev）
#
# 首次使用需要在 GitHub 仓库 Settings > Secrets and variables > Actions 添加两个 Secrets：
#   CLOUDFLARE_API_TOKEN   具有 Account - Cloudflare Pages - Edit 权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账号 ID（Workers & Pages 概览页右侧可查看）
#
# 注意：freeres 是通过「直接上传」创建的 Pages 项目，Cloudflare 不支持给已有项目追加 Git 集成，
# 因此这里用 Wrangler 在 CI 里构建后直接上传，项目原有的 D1 / Workers AI / 密钥等绑定保持不变。

name: Deploy to Cloudflare Pages (freeres)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-freeres
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vite.config.ts 的 outDir 是 ../deploy（仓库同级目录），产物需含 _worker.js 与 _routes.json
      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f ../deploy/index.html
          test -f ../deploy/_worker.js
          test -f ../deploy/_routes.json
          echo "构建产物校验通过"

      - name: Check Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::请先在仓库 Settings > Secrets and variables > Actions 添加 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy to freeres.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.158.0 pages deploy ../deploy --project-name=freeres --branch=main
